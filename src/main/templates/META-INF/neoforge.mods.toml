modLoader="javafml" #mandatory

loaderVersion="${loader_version_range}" #mandatory

license="${mod_license}"

issueTrackerURL="https://github.com/Agwstin/ArsManaHud/issues"

[[mods]] #mandatory

modId="${mod_id}" #mandatory

version="${mod_version}" #mandatory

displayName="${mod_name}" #mandatory

#updateJSONURL="https://change.me.example.invalid/updates.json" #optional

displayURL="https://github.com/Agwstin/ArsManaHud" #optional

logoFile="arsmanahud.png" #optional

credits="Fork of Ars NumericHUD by WFPhantom. Thanks to Moonwolf, Sarenor, Alexth99" #optional

authors="${mod_authors}" #optional

description='''${mod_description}'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="${neo_version_range}" #mandatory
    ordering="NONE"
    side="CLIENT"

# Here's another dependency
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="ars_nouveau"
    type="required"
    versionRange="[5.6.0,)"
    ordering="NONE"
    side="CLIENT"
# Fork of Ars NumericHUD - both do the same thing, so don't load them together
[[dependencies.${mod_id}]]
    modId="arsnumerichud"
    type="incompatible"
    reason="Ars Mana HUD is a maintained fork of Ars NumericHUD. Remove Ars NumericHUD."
    versionRange="[0,)"
    ordering="NONE"
    side="CLIENT"
